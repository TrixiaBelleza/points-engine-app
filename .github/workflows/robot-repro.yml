# One-time Ready, Set, Repro! runner: generated .robot files against Staging only.
# Suites read APP_PUBLIC_URL (tests/robot/resources/common.resource). This workflow
# maps repository variable/secret STAGING_BASE_URL onto that env var.

name: Robot Repro (Staging)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      test_ref:
        description: Repro Agent branch or commit SHA to test
        required: true
        type: string
      test_path:
        description: Repository-relative .robot file to run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: robot-repro-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  robot-repro:
    name: Run generated Robot tests on Staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'ready-set-repro/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      ROBOT_HEADLESS: "true"
      ROBOT_RESULTS_DIR: tests/robot/results

    steps:
      - name: Checkout unmerged pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout test_ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
          fetch-depth: 1

      - name: Configure runner paths
        run: echo "ROBOT_FILE_LIST=${RUNNER_TEMP}/robot-repro-files.txt" >> "${GITHUB_ENV}"

      - name: Require STAGING_BASE_URL
        env:
          STAGING_BASE_URL_VAR: ${{ vars.STAGING_BASE_URL }}
          STAGING_BASE_URL_SECRET: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          url="${STAGING_BASE_URL_VAR:-}"
          if [ -z "${url}" ]; then
            url="${STAGING_BASE_URL_SECRET:-}"
          fi
          if [ -z "${url}" ]; then
            echo "STAGING_BASE_URL is not configured."
            echo "Add a GitHub Actions repository variable or secret named STAGING_BASE_URL"
            echo "set to the Staging public URL. Robot suites map it to APP_PUBLIC_URL."
            echo "This runner never uses a Production URL."
            exit 1
          fi
          {
            echo "APP_PUBLIC_URL<<EOF"
            echo "${url}"
            echo "EOF"
          } >> "${GITHUB_ENV}"
          echo "STAGING_BASE_URL is set (value not printed)."

      - name: Select changed Robot files from the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash .github/scripts/robot-repro.sh select-pr

      - name: Select workflow_dispatch Robot file
        if: github.event_name == 'workflow_dispatch'
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: bash .github/scripts/robot-repro.sh select-dispatch

      - name: Drop git credentials before running generated tests
        run: |
          set -euo pipefail
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/robot/requirements.txt

      - name: Install Robot Framework and SeleniumLibrary
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/robot/requirements.txt

      - name: Ensure Google Chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            echo "Installing google-chrome-stable for SeleniumLibrary."
            wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
              | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
            google-chrome --version
          fi

      - name: Run Robot tests against Staging
        env:
          SUPERADMIN_EMAIL_SECRET: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD_SECRET: ${{ secrets.SUPERADMIN_PASSWORD }}
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${SUPERADMIN_EMAIL_SECRET:-}" ]; then
            export SUPERADMIN_EMAIL="${SUPERADMIN_EMAIL_SECRET}"
          fi
          if [ -n "${SUPERADMIN_PASSWORD_SECRET:-}" ]; then
            export SUPERADMIN_PASSWORD="${SUPERADMIN_PASSWORD_SECRET}"
          fi
          unset SUPERADMIN_EMAIL_SECRET SUPERADMIN_PASSWORD_SECRET
          bash .github/scripts/robot-repro.sh run

      - name: Collect Robot artifacts
        if: always()
        run: bash .github/scripts/robot-repro.sh collect

      - name: Upload Robot logs, report, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-repro-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/robot/results/
            log.html
            report.html
            output.xml
            selenium-screenshot-*.png
            selenium-video-*.webm
